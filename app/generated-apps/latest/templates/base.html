<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nine Men Morris - Project Planning{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#1a1a1a',
                        'dark-secondary': '#2d2d2d',
                        'dark-accent': '#3f3f3f',
                        'game-board': '#8B4513',
                        'game-light': '#DEB887'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-primary text-gray-100 min-h-screen">
    <nav class="bg-dark-secondary border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-white hover:text-gray-300">Nine Men Morris</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="/game" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Game</a>
                    <a href="/epics" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Epics</a>
                    <a href="/stories" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Stories</a>
                    <a href="/tasks" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Tasks</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark-secondary border-t border-gray-700 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-center text-gray-400">&copy; 2024 Nine Men Morris Project Planning Tool</p>
        </div>
    </footer>
</body>
</html>
